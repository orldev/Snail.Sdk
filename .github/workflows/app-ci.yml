name: application CI

# The build and tests of a Snail ASP.NET application, called from its own ci.yml:
#
#   jobs:
#     ci:
#       uses: orldev/Snail.Sdk/.github/workflows/app-ci.yml@v1
#       secrets: inherit    # only for tests that pull a signed-in Docker Hub image
#
# The tests and the conformance check. An application publishes no package and no API reference: it is released as
# its image, which its image.yml builds through mcp-image.yml on every push and pushes from a version tag.

on:
  workflow_call:
    inputs:
      solution:
        description: The solution to build; the one .slnx at the root when empty.
        type: string
        default: ''
      os:
        description: The runner the tests run on.
        type: string
        default: ubuntu-latest
      test-filter:
        description: A dotnet test filter, such as one that leaves out tests needing a container.
        type: string
        default: ''
      test-environment:
        description: Variables the tests run with, one NAME=value a line, such as one that turns a skipped container test into a failure.
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      # A test container whose image Docker Hub gives only to a signed-in pull: the caller passes secrets: inherit and
      # keeps DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; without them the step is skipped.
      - name: Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Solution
        id: solution
        env:
          GIVEN: ${{ inputs.solution }}
        run: |
          solution="${GIVEN:-$(find . -maxdepth 1 -name '*.slnx' | head -n 1)}"
          if [ ! -f "$solution" ]; then
            echo "::error::no solution found: name one in the 'solution' input"
            exit 1
          fi
          echo "path=$solution" >> "$GITHUB_OUTPUT"

      - name: Tests
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
          FILTER: ${{ inputs.test-filter }}
          ENVIRONMENT: ${{ inputs.test-environment }}
        run: |
          arguments=(test "$SOLUTION" -c Release --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests)
          if [ -n "$FILTER" ]; then
            arguments+=(--filter "$FILTER")
          fi
          while IFS= read -r variable; do
            if [ -n "$variable" ]; then
              export "${variable?}"
            fi
          done <<< "$ENVIRONMENT"
          dotnet "${arguments[@]}"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test results
          path: artifacts/tests

      - name: Conformance
        run: |
          project="$(find src -name '*.csproj' -not -path '*/obj/*' | sort | head -n 1)"
          dotnet msbuild "$project" -t:SnailConformance -nologo
